name: Synchronize Capacitor lockfile
on:
  push:
    branches: [fix/capacitor-peer-versions]
    paths: ['package.json', '.github/workflows/sync-capacitor-lockfile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capacitor-peer-versions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Commit resolved lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: synchronize Capacitor 8 dependency lockfile"
            git push origin HEAD:fix/capacitor-peer-versions
          fi
