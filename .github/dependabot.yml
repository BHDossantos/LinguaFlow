version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Capacitor packages MUST move together (same major), or the native
      # build won't install. Keep every @capacitor/* bump in one PR.
      capacitor:
        patterns: ["@capacitor/*"]
      # React core + types move together too.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Batch the rest of the minor/patch bumps into one PR to cut noise.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Tailwind v4 is a breaking change (PostCSS plugin moved to
      # @tailwindcss/postcss, CSS-first config). Stay on v3 until we do the
      # migration deliberately. See docs/LAUNCH_READINESS.md.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # These chained the Tailwind v4 bump; hold their majors too.
      - dependency-name: "postcss-selector-parser"
        update-types: ["version-update:semver-major"]
      # Stay on React 18 until a deliberate React 19 migration. A lone react-dom
      # or @types/react-dom major break the install (peer mismatch).
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
