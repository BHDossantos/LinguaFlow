version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Capacitor packages MUST move together (same major), or the native
      # build won't install. Keep every @capacitor/* bump in one PR.
      capacitor:
        patterns: ["@capacitor/*"]
      # React core + types move together too.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Batch the rest of the minor/patch bumps into one PR to cut noise.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pre-launch stability: do NOT auto-propose ANY major-version bump. Every
      # recent build break came from a drive-by major (Tailwind v4, the split
      # Capacitor v8, react-dom 19, and the flood of Next 16 / TS 7 / eslint 10 /
      # zod 4 / vitest 4 PRs). Majors are adopted deliberately, by hand, with a
      # verified build — not merged by a bot. Minor/patch (incl. security) still
      # flow, grouped above.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
